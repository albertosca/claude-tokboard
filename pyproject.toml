[tool.ruff]
target-version = "py310"
line-length = 100
# ruff 0.16+ lints/formats *.md by default (fenced Python code blocks).
# docs/superpowers holds historical plan/spec records - mechanically
# reformatting the code samples quoted inside them would rewrite history
# that has nothing to do with this project's actual source tree.
# This exclude only covers docs/ - Ruff still formats/lints markdown files
# outside it (e.g. README.md, commands/*.md, scripts/README.md). A future
# CI phase running `ruff format --check .` can still fail on one of those
# for this reason.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
# dashboard_html.py/dashboard_tui.py reach lib/metrics_core via
# sys.path.insert(0, ".../lib") at runtime rather than a package install;
# mypy_path mirrors that so `import metrics_core` resolves statically too.
mypy_path = "lib"
# textual/textual-plotext ship no type stubs. Two separate installs exist
# and the distinction matters (2026-09-01): requirements-tui.txt is what
# scripts/setup-tui-venv.sh auto-provisions into the repo's .venv for END
# USERS of the plugin, while requirements-dev.txt installs the same two
# libraries into whichever interpreter runs pytest, because the TUI tests
# now import dashboard_tui and drive it in-process. So the TUI is no
# longer "isolated in its own venv" as far as this repo's own tooling is
# concerned - mypy and pytest both see it directly.
#
# follow_imports = "skip" makes mypy treat both packages as Any, which is
# exactly what it did before 2026-09-01 - back then they were simply not
# installed anywhere mypy could see, and ignore_missing_imports did the
# same job. requirements-dev.txt now installs them, both ship py.typed,
# and mypy consequently started type-checking dashboard_tui.py against
# them for the first time: 24 findings, none of which this phase's task
# introduced and none of which is a defect in dashboard_tui.py itself.
#
# They split three ways, and the split is why this is a "skip" rather
# than a licence to edit production code:
#   * 8 are "unused type: ignore" on the very `# type: ignore[misc]
#     # textual: base is Any (no stubs)` comments that exist BECAUSE
#     textual used to be Any - self-cancelling, and their comment text is
#     now the stale half.
#   * 4 come from a WRONG upstream stub. textual_plotext's hand-written
#     plotext/_figure.pyi declares stacked_bar(label=...) with a scalar
#     `color`, but the vendored runtime it ships alongside takes
#     `labels=` and accepts a list - verified by inspect.signature, and
#     by dashboard_tui.py:530 running green under test. Obeying that stub
#     would BREAK working code.
#   * the rest are real-but-cosmetic annotation gaps (a bare `current =
#     None` later assigned a set, unparameterized Tree/App generics).
#
# Adopting textual's types is worth doing, but it is a typing change to
# dashboard_tui.py, and Phase 3e Task 1 is forbidden from touching that
# file. Deliberately left as follow-up rather than smuggled in here; see
# the Task 1 report for the full list.
[[tool.mypy.overrides]]
# plotext.* added here (Phase 3e Task 2, 2026-09-01): tests/test_tui_chart.py
# imports it directly (import plotext) to derive the "gray" ANSI escape
# sequence from plotext's own colorize() rather than hard-coding one, so a
# future palette remap can't silently make that assertion meaningless. Same
# situation as textual/textual_plotext above - no stubs, no py.typed.
module = ["textual.*", "textual_plotext.*", "plotext.*"]
ignore_missing_imports = true
follow_imports = "skip"

# pytest test functions returning None implicitly, with no `-> None`
# annotation, are the idiomatic norm (https://docs.pytest.org/ conventions
# and every example in its own docs write them this way) - not a bug worth
# fighting file by file. Every non-test helper in tests/ (fixtures'
# internals, JSON/transcript builders, the TUI harness helpers) is still
# fully annotated; this override only relaxes the requirement that bare `def
# test_foo():`/fixture signatures declare types, confirmed by re-running
# `mypy --strict scripts tests` after annotating every real helper and
# finding the remaining findings were 100% no-untyped-def on test/fixture
# function signatures (2026-08-25, Task 5 of the python-quality-standard
# plan). check_untyped_defs stays on (inherited from strict, not disabled
# here), so bodies of these functions are still type-checked - only their
# signatures are excused.
[[tool.mypy.overrides]]
# tests/ has no __init__.py (pytest's rootdir-relative import mode expects
# that - see conftest.py, js_runtime.py etc. importing each other as bare
# top-level modules), so mypy sees these as plain module names, never as
# "tests.*". Listed explicitly rather than by a glob: mypy's per-module
# patterns only match whole dotted components ("pkg.*", "*.mod"), not a
# partial-name wildcard like "test_*" (confirmed empirically - it silently
# matched nothing here).
module = [
    "conftest",
    "js_runtime",
    "test_backfill",
    "test_backfill_script",
    "test_dashboard_html_backfill_note",
    "test_dashboard_html_charts",
    "test_dashboard_html_formatters",
    "test_dashboard_html_page",
    "test_dashboard_html_rows",
    "test_dashboard_rendering",
    "test_fixture_isolation",
    "test_format",
    "test_granularity",
    "test_js_runtime",
    "test_labels",
    "test_metrics_log_hook",
    "test_period_filters",
    "test_periods",
    "test_project_totals",
    "test_projects",
    "test_records",
    "test_subagent_metrics_log_hook",
    "test_tui_chart",
    "test_tui_clicks",
    "test_tui_responsiveness",
    "test_tui_state",
    "test_verify_detectors",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# dashboard_tui.py was excluded until 2026-09-01, because the TUI tests
# shelled out to .venv/bin/python3 and coverage.py could not see into the
# child. They now import dashboard_tui and drive it in-process through
# Textual's own testing API (see tests/test_tui_state.py's docstring for
# why that, and not a COVERAGE_PROCESS_START/.pth arrangement), so it is
# measured by a plain `pytest` run with no environment-level setup step.
addopts = "--cov=lib/metrics_core --cov=dashboard_html --cov=dashboard_html_assets --cov=dashboard_tui --cov=scripts --cov=hooks --cov-branch"

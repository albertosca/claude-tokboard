[tool.ruff]
target-version = "py310"
line-length = 100
# ruff 0.16+ lints/formats *.md by default (fenced Python code blocks).
# docs/superpowers holds historical plan/spec records - mechanically
# reformatting the code samples quoted inside them would rewrite history
# that has nothing to do with this project's actual source tree.
# This exclude only covers docs/ - Ruff still formats/lints markdown files
# outside it (e.g. README.md, commands/*.md, scripts/README.md). A future
# CI phase running `ruff format --check .` can still fail on one of those
# for this reason.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
# dashboard_html.py/dashboard_tui.py reach lib/metrics_core via
# sys.path.insert(0, ".../lib") at runtime rather than a package install;
# mypy_path mirrors that so `import metrics_core` resolves statically too.
mypy_path = "lib"
# textual/textual-plotext ship no type stubs; the TUI dashboard is the
# only consumer, isolated in its own venv (see requirements-tui.txt).
[[tool.mypy.overrides]]
module = ["textual.*", "textual_plotext.*"]
ignore_missing_imports = true

# pytest test functions returning None implicitly, with no `-> None`
# annotation, are the idiomatic norm (https://docs.pytest.org/ conventions
# and every example in its own docs write them this way) - not a bug worth
# fighting file by file. Every non-test helper in tests/ (fixtures'
# internals, JSON/transcript builders, the TUI drivers) is still fully
# annotated; this override only relaxes the requirement that bare `def
# test_foo():`/fixture signatures declare types, confirmed by re-running
# `mypy --strict scripts tests` after annotating every real helper and
# finding the remaining findings were 100% no-untyped-def on test/fixture
# function signatures (2026-08-25, Task 5 of the python-quality-standard
# plan). check_untyped_defs stays on (inherited from strict, not disabled
# here), so bodies of these functions are still type-checked - only their
# signatures are excused.
[[tool.mypy.overrides]]
# tests/ has no __init__.py (pytest's rootdir-relative import mode expects
# that - see conftest.py, js_runtime.py etc. importing each other as bare
# top-level modules), so mypy sees these as plain module names, never as
# "tests.*". Listed explicitly rather than by a glob: mypy's per-module
# patterns only match whole dotted components ("pkg.*", "*.mod"), not a
# partial-name wildcard like "test_*" (confirmed empirically - it silently
# matched nothing here).
module = [
    "conftest",
    "js_runtime",
    "test_backfill",
    "test_backfill_script",
    "test_dashboard_html_backfill_note",
    "test_dashboard_html_charts",
    "test_dashboard_html_formatters",
    "test_dashboard_html_page",
    "test_dashboard_html_rows",
    "test_dashboard_rendering",
    "test_fixture_isolation",
    "test_format",
    "test_granularity",
    "test_js_runtime",
    "test_labels",
    "test_metrics_log_hook",
    "test_period_filters",
    "test_periods",
    "test_project_totals",
    "test_projects",
    "test_records",
    "test_tui_responsiveness",
    "test_tui_state",
    "test_verify_detectors",
    "tui_latency_driver",
    "tui_state_driver",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# dashboard_tui.py is deliberately excluded: it's only ever exercised via
# subprocess in its own .venv (see tests/tui_state_driver.py and friends),
# never imported inside this pytest process, so coverage.py can't measure
# it and including it only produces a spurious CoverageWarning.
addopts = "--cov=lib/metrics_core --cov=dashboard_html --cov=dashboard_html_assets --cov=scripts --cov=hooks --cov-branch"

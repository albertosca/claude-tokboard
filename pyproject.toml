[tool.ruff]
target-version = "py310"
line-length = 100
# ruff 0.16+ lints/formats *.md by default (fenced Python code blocks).
# docs/superpowers holds historical plan/spec records - mechanically
# reformatting the code samples quoted inside them would rewrite history
# that has nothing to do with this project's actual source tree.
# This exclude only covers docs/ - Ruff still formats/lints markdown files
# outside it (e.g. README.md, commands/*.md, scripts/README.md). A future
# CI phase running `ruff format --check .` can still fail on one of those
# for this reason.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
# dashboard_html.py/dashboard_tui.py reach lib/metrics_core via
# sys.path.insert(0, ".../lib") at runtime rather than a package install;
# mypy_path mirrors that so `import metrics_core` resolves statically too.
mypy_path = "lib"
# textual/textual-plotext ship real types (py.typed) as of the versions
# pinned here, installed into whichever interpreter runs pytest via
# requirements-dev.txt (and separately into end users' own .venv via
# requirements-tui.txt / scripts/setup-tui-venv.sh - two installs, same
# versions, different audiences). dashboard_tui.py's own real types are
# adopted (2026-09-13, backlog item 2026-09-01): no override needed for
# either package. The two type: ignore[call-arg]/[arg-type] pairs left in
# dashboard_tui.py's stacked_bar() calls are a real upstream stub bug, not
# local debt - textual_plotext's hand-written plotext/_figure.pyi declares
# stacked_bar(label=...) with a scalar `color`, but the vendored runtime it
# wraps takes `labels=` (plural) and a color list, confirmed by
# inspect.signature against the installed plotext.stacked_bar directly.
# See docs/superpowers/BACKLOG.md's 2026-09-01 entry for the full history
# of the 24 findings this phase closed.
[[tool.mypy.overrides]]
# plotext.* has no stubs of its own (textual_plotext.plotext is a vendored
# copy of it, which DOES ship stubs, covered above - this is the real
# upstream package, imported directly by tests/test_tui_chart.py to derive
# the "gray" ANSI escape sequence from plotext's own colorize() rather than
# hard-coding one, so a future palette remap can't silently make that
# assertion meaningless).
module = ["plotext.*"]
ignore_missing_imports = true

# pytest test functions returning None implicitly, with no `-> None`
# annotation, are the idiomatic norm (https://docs.pytest.org/ conventions
# and every example in its own docs write them this way) - not a bug worth
# fighting file by file. Every non-test helper in tests/ (fixtures'
# internals, JSON/transcript builders, the TUI harness helpers) is still
# fully annotated; this override only relaxes the requirement that bare `def
# test_foo():`/fixture signatures declare types, confirmed by re-running
# `mypy --strict scripts tests` after annotating every real helper and
# finding the remaining findings were 100% no-untyped-def on test/fixture
# function signatures (2026-08-25, Task 5 of the python-quality-standard
# plan). check_untyped_defs stays on (inherited from strict, not disabled
# here), so bodies of these functions are still type-checked - only their
# signatures are excused.
[[tool.mypy.overrides]]
# tests/ has no __init__.py (pytest's rootdir-relative import mode expects
# that - see conftest.py, js_runtime.py etc. importing each other as bare
# top-level modules), so mypy sees these as plain module names, never as
# "tests.*". Listed explicitly rather than by a glob: mypy's per-module
# patterns only match whole dotted components ("pkg.*", "*.mod"), not a
# partial-name wildcard like "test_*" (confirmed empirically - it silently
# matched nothing here).
module = [
    "conftest",
    "js_runtime",
    "test_backfill",
    "test_backfill_script",
    "test_dashboard_html_backfill_note",
    "test_dashboard_html_charts",
    "test_dashboard_html_formatters",
    "test_dashboard_html_page",
    "test_dashboard_html_rows",
    "test_dashboard_rendering",
    "test_fixture_isolation",
    "test_format",
    "test_granularity",
    "test_js_runtime",
    "test_labels",
    "test_make_coverage_badge",
    "test_metrics_log_hook",
    "test_period_filters",
    "test_periods",
    "test_project_totals",
    "test_projects",
    "test_records",
    "test_subagent_metrics_log_hook",
    "test_tokens_by_model_backfill",
    "test_tui_chart",
    "test_tui_data_shapes",
    "test_tui_unconstrained",
    "test_tui_clicks",
    "test_tui_responsiveness",
    "test_tui_state",
    "test_tui_unbound",
    "test_verify_detectors",
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# dashboard_tui.py was excluded until 2026-09-01, because the TUI tests
# shelled out to .venv/bin/python3 and coverage.py could not see into the
# child. They now import dashboard_tui and drive it in-process through
# Textual's own testing API (see tests/test_tui_state.py's docstring for
# why that, and not a COVERAGE_PROCESS_START/.pth arrangement), so it is
# measured by a plain `pytest` run with no environment-level setup step.
addopts = "--cov=lib/metrics_core --cov=dashboard_html --cov=dashboard_html_assets --cov=dashboard_tui --cov=scripts --cov=hooks --cov-branch"

[tool.coverage.report]
# The gate (Phase 4, 2026-09-03). Every module in the --cov set above is at
# 100% statement and branch, so this locks it there: a single uncovered line
# fails the run. Proven able to fail before being trusted - appending one
# never-called function to lib/metrics_core/format.py took the total to
# 99.96% and pytest exited 1 while all 582 tests still passed. A gate that
# has not been shown to go red is not a gate.
#
# Declared here rather than as --cov-fail-under in addopts so that a bare
# `coverage report` enforces the same number: one source of truth.
#
# NOTE for anyone running a SUBSET of the suite: pytest-cov applies this
# threshold to whatever ran, so `pytest tests/test_format.py` reports ~9%
# and fails - not because anything is broken, but because coverage measured
# over one file is meaningless. Use `--no-cov` for subset runs. This is a
# deliberate trade: the alternative (gate only in CI) leaves a full local
# run unable to catch a regression, and this repo's standing practice is to
# run the whole suite anyway, which takes about 30 seconds.
fail_under = 100

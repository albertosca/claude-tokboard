name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow never writes to the repository, so it never
# needs anything beyond the default token scope - see ci.yml's `badge`
# job for the one place in this repo that does need contents: write.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict .
